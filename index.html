<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>IronPull</title>
<link id="apple-icon" rel="apple-touch-icon">
<link id="favicon" rel="icon" type="image/png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IronPull">
<meta name="theme-color" content="#07070f">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
:root{
  --bg:#07070f;--bg2:#0d0d1c;
  --s1:#11111e;--s2:#171729;--s3:#1f1f35;--s4:#27273f;
  --border:#2a2a48;--border2:#353558;
  --gold:#c8a84b;--gold2:#e8c96a;--gold3:#f5dfa0;--gold-d:rgba(200,168,75,.14);
  --grn:#00c96e;--grn-d:rgba(0,201,110,.13);
  --blu:#4a9eff;--blu-d:rgba(74,158,255,.13);
  --red:#ff4a6e;--red-d:rgba(255,74,110,.1);
  --txt:#eeeef8;--txt2:#8888aa;
  --nav:80px;--r:14px;--r2:22px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--txt);font-family:'DM Sans',sans-serif;height:100%;overflow:hidden}
::-webkit-scrollbar{display:none}
#app{height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden}

.page{flex:1;overflow-y:auto;padding:16px 16px calc(var(--nav) + 20px);display:none;animation:fadeUp .25s ease}
.page.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

.nav{
  position:fixed;bottom:0;left:0;right:0;height:var(--nav);
  background:var(--s1);border-top:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-around;
  padding:0 4px;padding-bottom:env(safe-area-inset-bottom,0px);z-index:100
}
.nb{display:flex;flex-direction:column;align-items:center;gap:3px;
  background:none;border:none;color:var(--txt2);font-family:'DM Sans',sans-serif;
  font-size:10px;font-weight:500;cursor:pointer;padding:8px 10px;border-radius:12px;
  transition:color .2s;min-width:56px}
.nb.active{color:var(--gold)}
.nb svg{width:22px;height:22px;stroke-width:1.8}
.nav-fab-wrap{display:flex;align-items:center;justify-content:center;margin-top:-24px}
.nav-fab{
  width:62px;height:62px;background:linear-gradient(145deg,var(--gold),var(--gold2));
  border-radius:18px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:1px;box-shadow:0 6px 28px rgba(200,168,75,.5);
  border:3px solid var(--bg);cursor:pointer;color:#000;
  font-size:9px;font-weight:700;font-family:'DM Sans',sans-serif;
  transition:transform .15s,box-shadow .15s
}
.nav-fab:active{transform:scale(.93)}
.nav-fab.active{box-shadow:0 8px 36px rgba(200,168,75,.7)}
.nav-fab svg{width:26px;height:26px;stroke-width:2.2}

.auth{position:fixed;inset:0;background:var(--bg);z-index:200;display:flex;flex-direction:column;padding:48px 24px 36px;animation:fadeUp .3s ease}
.auth.hidden{display:none}
.auth-logo{font-family:'Bebas Neue',sans-serif;font-size:52px;letter-spacing:5px;background:linear-gradient(135deg,var(--gold),var(--gold3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center;margin-bottom:2px}
.auth-tag{font-size:12px;color:var(--txt2);text-align:center;letter-spacing:2px;text-transform:uppercase;margin-bottom:36px}

.ob{position:fixed;inset:0;background:var(--bg);z-index:200;display:flex;flex-direction:column;padding:48px 24px 36px;animation:fadeUp .3s ease}
.ob.hidden{display:none}
.ob-logo{font-family:'Bebas Neue',sans-serif;font-size:52px;letter-spacing:5px;background:linear-gradient(135deg,var(--gold),var(--gold3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center;margin-bottom:2px}
.ob-tag{font-size:12px;color:var(--txt2);text-align:center;letter-spacing:2px;text-transform:uppercase;margin-bottom:36px}
.ob-dots{display:flex;gap:8px;justify-content:center;margin-bottom:32px}
.ob-dot{width:8px;height:8px;border-radius:4px;background:var(--border);transition:all .3s}
.ob-dot.active{background:var(--gold);width:24px}
.ob-step{display:none;flex-direction:column;flex:1}
.ob-step.active{display:flex}
.ob-h{font-family:'Bebas Neue',sans-serif;font-size:34px;letter-spacing:2px;margin-bottom:6px}
.ob-sub{font-size:13px;color:var(--txt2);line-height:1.6;margin-bottom:28px}
.spacer{flex:1}
.av-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px}
.av-opt{aspect-ratio:1;border-radius:50%;background:var(--s2);border:2px solid var(--border);font-size:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:border-color .2s,background .2s}
.av-opt.sel{border-color:var(--gold);background:var(--gold-d)}

.fg{margin-bottom:14px}
.fl{font-size:10px;color:var(--txt2);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px;display:block}
.fi{background:var(--s2);border:1px solid var(--border);border-radius:12px;padding:13px 16px;color:var(--txt);font-family:'DM Sans',sans-serif;font-size:15px;width:100%;outline:none;transition:border-color .2s}
.fi:focus{border-color:var(--gold)}
textarea.fi{resize:none;line-height:1.5}

.btn{border:none;border-radius:14px;padding:15px 24px;font-size:15px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;width:100%;transition:opacity .2s,transform .12s;margin-bottom:10px}
.btn:active{transform:scale(.98);opacity:.9}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#000}
.btn-dark{background:var(--s3);color:var(--txt);border:1px solid var(--border)}
.btn-blue{background:var(--blu-d);color:var(--blu);border:1px solid rgba(74,158,255,.3)}
.btn-red{background:var(--red-d);color:var(--red);border:1px solid rgba(255,74,110,.3)}

.card{background:var(--s1);border:1px solid var(--border);border-radius:var(--r2);padding:20px;margin-bottom:14px}
.card-title{font-size:10px;color:var(--txt2);text-transform:uppercase;letter-spacing:.8px;margin-bottom:12px}

.home-top{display:flex;justify-content:space-between;align-items:flex-start;padding-top:10px;margin-bottom:22px}
.home-greet{font-size:13px;color:var(--txt2);margin-bottom:2px}
.home-name{font-size:22px;font-weight:600}
.streak-pill{background:var(--gold-d);border:1px solid rgba(200,168,75,.35);border-radius:20px;padding:7px 13px;font-size:14px;color:var(--gold);display:flex;align-items:center;gap:5px}

.ring-card{background:linear-gradient(145deg,var(--s1),var(--s2));border:1px solid var(--border);border-radius:var(--r2);display:flex;flex-direction:column;align-items:center;padding:28px 0 22px;margin-bottom:14px}
.ring-wrap{position:relative;display:inline-flex;align-items:center;justify-content:center}
.ring-inner{position:absolute;text-align:center}
.ring-pct{font-family:'Bebas Neue',sans-serif;font-size:56px;line-height:1;color:var(--txt)}
.ring-lbl{font-size:10px;color:var(--txt2);letter-spacing:1px;text-transform:uppercase;margin-top:2px}
.ring-goal{font-size:11px;color:var(--txt2);margin-top:10px;letter-spacing:.5px}

.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:14px}
.sc{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:16px 10px;text-align:center}
.sc-v{font-family:'Bebas Neue',sans-serif;font-size:30px;color:var(--gold)}
.sc-l{font-size:9px;color:var(--txt2);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}

.today-card{background:linear-gradient(135deg,var(--s2),var(--s3));border:1px solid var(--border);border-radius:var(--r2);padding:20px;margin-bottom:14px}

.tag{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:500}
.tag-g{background:var(--grn-d);color:var(--grn);border:1px solid rgba(0,201,110,.25)}
.tag-b{background:var(--blu-d);color:var(--blu);border:1px solid rgba(74,158,255,.25)}
.tag-r{background:var(--red-d);color:var(--red);border:1px solid rgba(255,74,110,.2)}
.tag-gold{background:var(--gold-d);color:var(--gold);border:1px solid rgba(200,168,75,.3)}

.cal-top{display:flex;align-items:center;justify-content:space-between;padding-top:10px;margin-bottom:18px}
.cal-month{font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:2px}
.cal-navs{display:flex;gap:8px}
.cal-nav{background:var(--s2);border:1px solid var(--border);color:var(--txt);border-radius:10px;padding:7px 14px;font-size:18px;cursor:pointer;transition:background .2s}
.wd-row{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;margin-bottom:6px}
.wd{font-size:9px;color:var(--txt2);text-transform:uppercase;letter-spacing:.4px;padding:3px 0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cd{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-size:13px;font-weight:500;position:relative;transition:transform .1s;border:1.5px solid transparent}
.cd:active{transform:scale(.88)}
.cd.empty{cursor:default}
.cd.today{border-color:var(--gold);background:var(--gold-d);color:var(--gold);font-weight:700}
.cd.done{background:var(--grn-d);border-color:rgba(0,201,110,.3);color:var(--grn)}
.cd.rest{background:var(--blu-d);border-color:rgba(74,158,255,.3);color:var(--blu)}
.cd.miss{background:var(--red-d);border-color:rgba(255,74,110,.15);color:var(--red)}
.cd.future{color:var(--txt2);opacity:.4;cursor:default}
.cd-dot{width:5px;height:5px;border-radius:50%;position:absolute;bottom:4px}
.legend{display:flex;flex-wrap:wrap;gap:14px;padding:14px;background:var(--s1);border-radius:var(--r);border:1px solid var(--border);margin-top:14px}
.li{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--txt2)}
.ld{width:9px;height:9px;border-radius:3px}
.cal-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.cal-btn{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:16px 12px;cursor:pointer;color:var(--txt);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:7px;transition:border-color .2s,background .2s}
.cal-btn:active{background:var(--s3)}
.cal-btn .ic{font-size:26px}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:150;display:flex;align-items:flex-end;backdrop-filter:blur(6px);animation:fadeUp .2s ease}
.overlay.hidden{display:none}
.modal{background:var(--s1);border-radius:26px 26px 0 0;padding:20px 18px 32px;width:100%;max-height:92dvh;overflow-y:auto;animation:slideUp .3s cubic-bezier(.34,1.56,.64,1)}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.mhandle{width:38px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 18px}
.mtitle{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px;margin-bottom:3px}
.msub{font-size:12px;color:var(--txt2);margin-bottom:18px}

.sets-wrap{display:flex;flex-direction:column;gap:9px;margin-bottom:14px}
.set-c{background:var(--s2);border:1.5px solid var(--border);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px;transition:border-color .2s,background .2s}
.set-c.done{border-color:var(--grn);background:var(--grn-d)}
.set-num{font-family:'Bebas Neue',sans-serif;font-size:19px;color:var(--txt2);min-width:28px}
.set-mid{flex:1}
.set-rl{font-size:9px;color:var(--txt2);text-transform:uppercase;letter-spacing:.4px}
.set-ri{background:none;border:none;color:var(--txt);font-family:'Bebas Neue',sans-serif;font-size:26px;width:70px;outline:none;padding:2px 0}
.set-chk{width:34px;height:34px;border-radius:50%;border:2px solid var(--border2);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:transparent;font-size:15px;transition:all .2s;flex-shrink:0}
.set-chk.done{background:var(--grn);border-color:var(--grn);color:#000}
.set-total{text-align:center;padding:12px;background:var(--s2);border-radius:12px;margin-bottom:14px;font-size:13px;color:var(--txt2)}
.set-total span{font-family:'Bebas Neue',sans-serif;font-size:26px;color:var(--gold)}

.sh{font-family:'Bebas Neue',sans-serif;font-size:34px;letter-spacing:2px;padding-top:10px;margin-bottom:4px}
.ss{font-size:13px;color:var(--txt2);margin-bottom:18px}
.hero{background:linear-gradient(135deg,var(--s2),var(--s3));border:1px solid var(--border);border-radius:var(--r2);padding:28px;text-align:center;margin-bottom:14px}
.hero-n{font-family:'Bebas Neue',sans-serif;font-size:72px;color:var(--gold);line-height:1}
.hero-l{font-size:11px;color:var(--txt2);text-transform:uppercase;letter-spacing:1px;margin-top:4px}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.sgc{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:16px}
.sgc-v{font-family:'Bebas Neue',sans-serif;font-size:36px;color:var(--txt)}
.sgc-l{font-size:10px;color:var(--txt2);text-transform:uppercase;letter-spacing:.5px}
.chart-box{background:var(--s1);border:1px solid var(--border);border-radius:var(--r2);padding:18px;margin-bottom:14px}
.chart-l{font-size:10px;color:var(--txt2);text-transform:uppercase;letter-spacing:.8px;margin-bottom:16px}
.bars{display:flex;align-items:flex-end;gap:5px;height:90px}
.bw{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.bar{width:100%;border-radius:5px 5px 0 0;min-height:4px;transition:height .6s ease}
.bar-w{background:linear-gradient(180deg,var(--gold3),var(--gold))}
.bar-r{background:var(--blu);opacity:.6}
.bar-e{background:var(--s3)}
.bl{font-size:9px;color:var(--txt2)}

.prof-top{display:flex;flex-direction:column;align-items:center;padding:24px 0 20px}
.p-av{width:90px;height:90px;border-radius:50%;background:var(--s2);border:3px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:46px;margin-bottom:12px;cursor:pointer;position:relative;overflow:hidden}
.p-av img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.p-av-ovr{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.65);padding:5px;text-align:center;font-size:9px;color:var(--gold);letter-spacing:.5px}
.p-name{font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:2px;margin-bottom:3px}
.p-age{font-size:13px;color:var(--txt2)}
.p-quote{background:var(--s2);border-left:3px solid var(--gold);border-radius:0 var(--r) var(--r) 0;padding:14px 16px;margin-bottom:14px;font-size:14px;color:var(--txt2);font-style:italic;line-height:1.6}
.divider{height:1px;background:var(--border);margin:14px 0}

.friend-card{background:var(--s1);border:1px solid var(--border);border-radius:var(--r2);padding:16px;margin-bottom:10px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:border-color .2s}
.friend-card:hover{border-color:var(--gold)}
.friend-av{width:44px;height:44px;border-radius:50%;background:var(--s2);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.friend-info{flex:1}
.friend-name{font-weight:600}
.friend-detail{font-size:11px;color:var(--txt2);margin-top:2px}
.friend-remove{background:none;border:none;color:var(--red);cursor:pointer;font-size:18px;padding:4px}

.friend-view{position:fixed;inset:0;background:var(--bg);z-index:180;overflow-y:auto;padding:20px;animation:fadeUp .3s ease}
.friend-view.hidden{display:none}
.friend-view-header{display:flex;align-items:center;gap:14px;margin-bottom:20px}
</style>
</head>
<body>
<div id="app">

<!-- AUTH SCREEN -->
<div class="auth" id="auth-screen">
  <div class="auth-logo">IRONPULL</div>
  <div class="auth-tag">Elite Pull-Up Tracker</div>
  <button class="btn btn-blue" onclick="authGoogleSignIn()" style="display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:16px;font-size:16px">
    <span style="font-size:22px;font-weight:700">G</span> Sign in with Google
  </button>
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;color:var(--txt2);font-size:12px">
    <div style="flex:1;height:1px;background:var(--border)"></div>
    <span>or</span>
    <div style="flex:1;height:1px;background:var(--border)"></div>
  </div>
  <div class="fg"><input class="fi" id="auth-email" type="email" placeholder="Email"></div>
  <div class="fg"><input class="fi" id="auth-pass" type="password" placeholder="Password"></div>
  <button class="btn btn-gold" onclick="authSignIn()">Sign In</button>
  <button class="btn btn-dark" onclick="authRegister()">Register</button>
  <div style="text-align:center;margin-top:20px;font-size:13px;color:var(--txt2);cursor:pointer" onclick="resetPassword()">Forgot password?</div>
</div>

<!-- ONBOARDING -->
<div class="ob hidden" id="ob">
  <div class="ob-logo">IRONPULL</div>
  <div class="ob-tag">Elite Pull-Up Tracker</div>
  <div class="ob-dots" id="ob-dots"> <div class="ob-dot active"></div><div class="ob-dot"></div><div class="ob-dot"></div> </div>
  <div class="ob-step active" id="ob-s1">
    <div class="ob-h">WHO ARE YOU?</div>
    <div class="ob-sub">Set up your profile.</div>
    <div class="fg"><label class="fl">Your Name</label><input class="fi" id="ob-name" type="text" placeholder="e.g. Alex" maxlength="20"></div>
    <div class="fg"><label class="fl">Age</label><input class="fi" id="ob-age" type="number" placeholder="e.g. 25" min="10" max="99"></div>
    <div class="spacer"></div>
    <button class="btn btn-gold" onclick="obNext(1)">Continue →</button>
  </div>
  <div class="ob-step" id="ob-s2">
    <div class="ob-h">YOUR CHALLENGE</div>
    <div class="ob-sub">Set your challenge and daily target.</div>
    <div class="fg"><label class="fl">Duration (days)</label><input class="fi" id="ob-days" type="number" value="30" min="7" max="365"></div>
    <div class="fg"><label class="fl">Daily Target</label><input class="fi" id="ob-target" type="number" value="100" min="10" max="1000"></div>
    <div class="fg"><label class="fl">Motivational Quote</label><input class="fi" id="ob-quote" type="text" placeholder="Pain is temporary..." maxlength="90"></div>
    <div class="spacer"></div>
    <button class="btn btn-gold" onclick="obNext(2)">Continue →</button>
    <button class="btn btn-dark" onclick="obBack(1)">← Back</button>
  </div>
  <div class="ob-step" id="ob-s3">
    <div class="ob-h">PICK YOUR AVATAR</div>
    <div class="ob-sub">Choose an emoji avatar.</div>
    <div class="av-grid" id="av-grid"></div>
    <div class="spacer"></div>
    <button class="btn btn-gold" onclick="obFinish()">🚀 Start Challenge</button>
    <button class="btn btn-dark" onclick="obBack(2)">← Back</button>
  </div>
</div>

<!-- PAGES -->
<div class="page active" id="page-home"></div>
<div class="page" id="page-cal"></div>
<div class="page" id="page-stats"></div>
<div class="page" id="page-prof"></div>
<div class="page" id="page-friends"></div>

<!-- NAV -->
<div class="nav">
  <button class="nb active" id="nb-home" onclick="go('home')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    Home
  </button>
  <button class="nb" id="nb-stats" onclick="go('stats')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
    Stats
  </button>
  <div class="nav-fab-wrap">
    <div class="nav-fab" id="nb-cal" onclick="go('cal')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      LOG
    </div>
  </div>

<script>
// Firebase
const firebaseConfig = {
  apiKey: "AIzaSyCjPbqIGxokUxUAe-CpexWIbhf62C1il68",
  authDomain: "ironpull.firebaseapp.com",
  databaseURL: "https://ironpull-default-rtdb.firebaseio.com",
  projectId: "ironpull",
  storageBucket: "ironpull.firebasestorage.app",
  messagingSenderId: "883044066447",
  appId: "1:883044066447:web:979b1a600c480377a17cfa"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();
const googleProvider = new firebase.auth.GoogleAuthProvider();

// Constants
const AVATARS=['💪','🦾','🏋️','⚡','🔥','🎯','🏆','👊','🦁','🐺','🦅','🐉','⚔️','🛡️','🥇'];
const DAYS_SHORT=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];

let S={
  uid:null,
  user:null,
  logs:{},
  cal:{y:0,m:0},
  curPage:'home',
  tmpUser:{},
  selAv:AVATARS[0],
  editAv:null,
  modalSets:[],
  logDate:null,
  friends:{},
};

function userRef(){ return db.ref('users/' + S.uid); }
function logsRef(){ return db.ref('users/' + S.uid + '/logs'); }
function friendsRef(){ return db.ref('users/' + S.uid + '/friends'); }

function syncFromFirebase(){
  if(!S.uid) return;
  userRef().once('value', snap => {
    const val = snap.val();
    if(val){
      S.user = val;
      S.logs = val.logs || {};
      S.friends = val.friends || {};
      render(S.curPage);
      document.getElementById('ob').classList.add('hidden');
    } else {
      document.getElementById('ob').classList.remove('hidden');
    }
  });
}

function saveUserToFirebase(){
  if(!S.uid) return;
  userRef().set({
    name: S.user.name,
    age: S.user.age,
    goalDays: S.user.goalDays,
    target: S.user.target,
    quote: S.user.quote,
    avatar: S.user.avatar,
    avatarImg: S.user.avatarImg || null,
    startDate: S.user.startDate,
    logs: S.logs,
    friends: S.friends
  });
}

function saveLogsToFirebase(){
  if(!S.uid) return;
  logsRef().set(S.logs);
}

// Auth
auth.onAuthStateChanged(user => {
  if (user) {
    S.uid = user.uid;
    document.getElementById('auth-screen').classList.add('hidden');
    syncFromFirebase();
  } else {
    S.uid = null;
    S.user = null;
    document.getElementById('auth-screen').classList.remove('hidden');
    document.querySelectorAll('.ob, .page').forEach(e => e.classList.remove('active'));
  }
});

function authGoogleSignIn(){
  auth.signInWithPopup(googleProvider).catch(e => alert(e.message));
}

function authSignIn(){
  const email = document.getElementById('auth-email').value;
  const pass = document.getElementById('auth-pass').value;
  auth.signInWithEmailAndPassword(email, pass).catch(e => alert(e.message));
}

function authRegister(){
  const email = document.getElementById('auth-email').value;
  const pass = document.getElementById('auth-pass').value;
  auth.createUserWithEmailAndPassword(email, pass).catch(e => alert(e.message));
}

function resetPassword(){
  const email = document.getElementById('auth-email').value;
  if(!email) return alert('Enter email first');
  auth.sendPasswordResetEmail(email).then(() => alert('Reset email sent!'));
}

function signOut(){
  auth.signOut();
}

// Router
function go(page){
  if(!S.uid) return;
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nb').forEach(b=>b.classList.remove('active'));
  document.getElementById('nb-cal').classList.remove('active');
  const pg = document.getElementById('page-'+page);
  if(pg) pg.classList.add('active');
  if(page==='cal') document.getElementById('nb-cal').classList.add('active');
  else {
    const nb = document.getElementById('nb-'+page);
    if(nb) nb.classList.add('active');
  }
  S.curPage=page;
  render(page);
}

function render(p){
  if(!S.user) return;
  if(p==='home') renderHome();
  else if(p==='cal') renderCal();
  else if(p==='stats') renderStats();
  else if(p==='prof') renderProf();
  else if(p==='friends') renderFriends();
}

// Computed
function wDays(){return Object.entries(S.logs).filter(([,v])=>v.type==='workout')}
function rDays(){return Object.entries(S.logs).filter(([,v])=>v.type==='rest')}
function totalReps(){return wDays().reduce((s,[,v])=>s+(v.total||0),0)}
function bestDay(){const d=wDays();return d.length?Math.max(...d.map(([,v])=>v.total||0)):0}
function avgDay(){const d=wDays();return d.length?Math.round(totalReps()/d.length):0}
function streak(){
  let n=0,d=new Date();
  while(true){
    const k=fmt(d),e=S.logs[k];
    if(!e||e.type!=='workout'){if(k===todayStr()&&!e){d.setDate(d.getDate()-1);continue}break}
    n++;d.setDate(d.getDate()-1);
  }
  return n;
}
function pct(){const g=S.user?.goalDays||30;return Math.min(100,Math.round(wDays().length/g*100))}
function dLeft(){return Math.max(0,(S.user?.goalDays||30)-wDays().length)}

function suggestSets(n){
  const t=S.user?.target||100;
  let count=n<=7?10:n<=14?8:n<=21?6:5;
  const base=Math.floor(t/count);
  const rem=t-base*count;
  return Array.from({length:count},(_,i)=>i<rem?base+1:base);
}

// Date utils
const fmt=d=>d.toISOString().split('T')[0];
const todayStr=()=>fmt(new Date());
const parseD=s=>new Date(s+'T00:00:00');

// Onboarding
function initAvGrid(id,sel,onSel){
  const g=document.getElementById(id);
  g.innerHTML=AVATARS.map((a,i)=>`<div class="av-opt${a===sel?' sel':''}" onclick="${onSel}(this,'${a}')">${a}</div>`).join('');
}
function selAv(el,av){
  document.querySelectorAll('#av-grid .av-opt').forEach(e=>e.classList.remove('sel'));
  el.classList.add('sel');S.selAv=av;
}
function selEditAv(el,av){
  document.querySelectorAll('#edit-av-grid .av-opt').forEach(e=>e.classList.remove('sel'));
  el.classList.add('sel');S.editAv=av;
}
function obDots(step){
  document.querySelectorAll('.ob-dot').forEach((d,i)=>d.classList.toggle('active',i<=step-1));
}
function obNext(step){
  if(step===1){
    const name=document.getElementById('ob-name').value.trim();
    const age=parseInt(document.getElementById('ob-age').value);
    if(!name||!age){alert('Fill all fields');return}
    S.tmpUser={name,age};
  }else if(step===2){
    const days=parseInt(document.getElementById('ob-days').value)||30;
    const target=parseInt(document.getElementById('ob-target').value)||100;
    const quote=document.getElementById('ob-quote').value.trim()||'Pain is temporary, glory is forever.';
    S.tmpUser={...S.tmpUser,goalDays:days,target,quote};
  }
  document.getElementById('ob-s'+step).classList.remove('active');
  document.getElementById('ob-s'+(step+1)).classList.add('active');
  obDots(step+1);
}
function obBack(toStep){
  document.getElementById('ob-s'+(toStep+1)).classList.remove('active');
  document.getElementById('ob-s'+toStep).classList.add('active');
  obDots(toStep);
}
function obFinish(){
  S.user={...S.tmpUser,avatar:S.selAv,avatarImg:null,startDate:todayStr()};
  S.friends = {};
  saveUserToFirebase();
  document.getElementById('ob').classList.add('hidden');
  go('home');
}

// Home
function renderHome(){
  const u=S.user,p=pct(),wd=wDays().length,dl=dLeft(),st=streak();
  const R=82,C=2*Math.PI*R,filled=C*(p/100);
  const ringCol=p>=100?'#00c96e':'#c8a84b';
  const entry=S.logs[todayStr()];
  const hr=new Date().getHours();
  const greet=hr<12?'Good morning':hr<17?'Good afternoon':'Good evening';

  let statusHTML='';
  if(entry?.type==='workout')statusHTML=`<div class="tag tag-g">✓ Completed — ${entry.total} pull-ups</div>`;
  else if(entry?.type==='rest')statusHTML=`<div class="tag tag-b">💤 Rest Day</div>`;
  else statusHTML=`<div class="tag tag-r">⏳ Not logged yet</div>`;

  let btnHTML='';
  if(!entry){
    btnHTML=`<button class="btn btn-gold" onclick="openLog('${todayStr()}')">🏋️ Log Today's Workout</button>
             <button class="btn btn-blue" onclick="saveRest('${todayStr()}')">💤 Mark as Rest Day</button>`;
  }else{
    btnHTML=`<button class="btn btn-dark" onclick="openLog('${todayStr()}')">✏️ Edit Today's Log</button>`;
  }

  const av=u.avatarImg?`<img src="${u.avatarImg}" style="width:44px;height:44px;object-fit:cover;border-radius:50%">`:u.avatar;

  document.getElementById('page-home').innerHTML=`
    <div class="home-top">
      <div>
        <div class="home-greet">${greet},</div>
        <div class="home-name">${u.name} ${av}</div>
      </div>
      <div class="streak-pill">🔥 ${st} day${st!==1?'s':''}</div>
    </div>
    <div class="ring-card">
      <div class="ring-wrap">
        <svg width="210" height="210" viewBox="0 0 210 210">
          <circle cx="105" cy="105" r="${R}" fill="none" stroke="#1a1a30" stroke-width="15"/>
          <circle cx="105" cy="105" r="${R}" fill="none" stroke="${ringCol}" stroke-width="13"
            stroke-linecap="round" stroke-dasharray="${filled} ${C-filled}"
            style="transform:rotate(-90deg);transform-origin:center"/>
        </svg>
        <div class="ring-inner">
          <div class="ring-pct">${p}%</div>
          <div class="ring-lbl">Complete</div>
        </div>
      </div>
      <div class="ring-goal">${wd} of ${u.goalDays} days done</div>
    </div>
    <div class="stat-row">
      <div class="sc"><div class="sc-v">${wd}</div><div class="sc-l">Trained</div></div>
      <div class="sc"><div class="sc-v">${dl}</div><div class="sc-l">Left</div></div>
      <div class="sc"><div class="sc-v">${st}</div><div class="sc-l">Streak 🔥</div></div>
    </div>
    <div class="today-card">
      <div class="card-title">TODAY — ${new Date().toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'})}</div>
      <div style="margin-bottom:14px">${statusHTML}</div>
      ${btnHTML}
    </div>
    <div class="card">
      <div class="card-title">Your Motivation</div>
      <div style="font-style:italic;color:var(--txt2);line-height:1.6;font-size:14px">"${u.quote}"</div>
    </div>
  `;
}

// Calendar
function renderCal(){
  const now=new Date();
  if(!S.cal.y){S.cal={y:now.getFullYear(),m:now.getMonth()}}
  const{y,m}=S.cal;
  const first=new Date(y,m,1).getDay();
  const dims=new Date(y,m+1,0).getDate();
  const td=todayStr();

  let cells='';
  for(let i=0;i<first;i++)cells+=`<div class="cd empty"></div>`;
  for(let d=1;d<=dims;d++){
    const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const e=S.logs[ds];
    const isT=ds===td,isPast=ds<td,isFut=ds>td;
    let cls='cd',dot='';
    if(isT)cls+=' today';
    else if(isFut)cls+=' future';
    if(e?.type==='workout'){cls+=' done';dot='<div class="cd-dot" style="background:var(--grn)"></div>'}
    else if(e?.type==='rest'){cls+=' rest';dot='<div class="cd-dot" style="background:var(--blu)"></div>'}
    else if(isPast&&!isT){cls+=' miss';dot='<div class="cd-dot" style="background:var(--red)"></div>'}
    const click=!isFut?`onclick="openLog('${ds}')"`:''
    cells+=`<div class="${cls}" ${click}>${d}${dot}</div>`;
  }

  document.getElementById('page-cal').innerHTML=`
    <div class="cal-top">
      <div>
        <div style="font-size:10px;color:var(--txt2);text-transform:uppercase;letter-spacing:.8px">Calendar</div>
        <div class="cal-month">${MONTHS[m]} ${y}</div>
      </div>
      <div class="cal-navs">
        <button class="cal-nav" onclick="chMo(-1)">‹</button>
        <button class="cal-nav" onclick="chMo(1)">›</button>
      </div>
    </div>
    <div class="wd-row">${['S','M','T','W','T','F','S'].map(d=>`<div class="wd">${d}</div>`).join('')}</div>
    <div class="cal-grid">${cells}</div>
    <div class="legend">
      <div class="li"><div class="ld" style="background:var(--grn)"></div>Completed</div>
      <div class="li"><div class="ld" style="background:var(--blu)"></div>Rest</div>
      <div class="li"><div class="ld" style="background:var(--red)"></div>Missed</div>
      <div class="li"><div class="ld" style="background:var(--gold);border-radius:50%"></div>Today</div>
    </div>
    <div class="cal-actions">
      <div class="cal-btn" onclick="openLog('${td}')"><div class="ic">🏋️</div><div>Log Today</div></div>
      <div class="cal-btn" onclick="openDatePick()"><div class="ic">📅</div><div>Log Other Day</div></div>
    </div>
  `;
}

function chMo(dir){
  let{y,m}=S.cal;m+=dir;
  if(m<0){m=11;y--}if(m>11){m=0;y++}
  S.cal={y,m};renderCal();
}

// Log Modal
function openLog(dateStr){
  S.logDate=dateStr;
  const existing=S.logs[dateStr];
  const wn=wDays().length+1;
  const suggested=suggestSets(wn);
  S.modalSets=existing?.type==='workout'
    ?existing.sets.map(r=>({reps:r,done:true}))
    :suggested.map(r=>({reps:r,done:false}));
  renderModalSets();
  showModal();
}

function openDatePick(){
  document.getElementById('modal-body').innerHTML=`
    <div class="mtitle">LOG A DATE</div>
    <div class="msub">Choose any past date to log.</div>
    <div class="fg"><input type="date" class="fi" id="modal-dp" max="${todayStr()}" value="${todayStr()}"></div>
    <button class="btn btn-gold" onclick="confirmDp()">Continue →</button>
    <button class="btn btn-dark" onclick="hideModal()">Cancel</button>
  `;
  showModal();
}
function confirmDp(){
  const v=document.getElementById('modal-dp').value;
  if(!v)return;hideModal();setTimeout(()=>openLog(v),120);
}

function renderModalSets(){
  const dl=S.logDate===todayStr()?'Today':parseD(S.logDate).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
  const total=S.modalSets.reduce((s,x)=>s+(x.done?x.reps:0),0);
  const existing=S.logs[S.logDate];

  document.getElementById('modal-body').innerHTML=`
    <div class="mtitle">LOG WORKOUT</div>
    <div class="msub">${dl} · Tap ✓ to check off each set</div>
    <div class="sets-wrap" id="sets-wrap">
      ${S.modalSets.map((set,i)=>`
        <div class="set-c${set.done?' done':''}" id="sc-${i}">
          <div class="set-num">S${i+1}</div>
          <div class="set-mid">
            <div class="set-rl">Reps</div>
            <input class="set-ri" type="number" value="${set.reps}" min="1" max="999"
              onchange="updReps(${i},this.value)" id="ri-${i}">
          </div>
          <button class="set-chk${set.done?' done':''}" onclick="togSet(${i})">${set.done?'✓':''}</button>
        </div>
      `).join('')}
    </div>
    <button class="btn btn-dark" onclick="addSet()" style="margin-bottom:12px">+ Add Set</button>
    <div class="set-total">Total: <span id="mod-tot">${total}</span> pull-ups</div>
    <button class="btn btn-gold" onclick="saveWorkout()">💾 Save Workout</button>
    <button class="btn btn-blue" onclick="saveRestFromModal()">💤 Mark as Rest Day</button>
    ${existing?`<button class="btn btn-dark" onclick="deleteLog()">🗑 Remove Log</button>`:''}
    <button class="btn btn-dark" onclick="hideModal()">Cancel</button>
  `;
}

function togSet(i){S.modalSets[i].done=!S.modalSets[i].done;updUI()}
function updReps(i,v){S.modalSets[i].reps=parseInt(v)||0;updUI()}
function addSet(){S.modalSets.push({reps:10,done:false});renderModalSets()}
function updUI(){
  S.modalSets.forEach((s,i)=>{
    const c=document.getElementById('sc-'+i);
    const b=c?.querySelector('.set-chk');
    if(!c)return;
    c.classList.toggle('done',s.done);
    b.classList.toggle('done',s.done);
    b.textContent=s.done?'✓':'';
  });
  const t=S.modalSets.reduce((s,x)=>s+(x.done?x.reps:0),0);
  const el=document.getElementById('mod-tot');if(el)el.textContent=t;
}

function saveWorkout(){
  const done=S.modalSets.filter(s=>s.done);
  const all=S.modalSets;
  const sets=(done.length?done:all).map(s=>s.reps);
  const total=sets.reduce((s,v)=>s+v,0);
  S.logs[S.logDate]={type:'workout',sets,total};
  saveLogsToFirebase();
  hideModal();
  render(S.curPage);
}
function saveRest(ds){
  S.logs[ds]={type:'rest',sets:[],total:0};
  saveLogsToFirebase();
  render(S.curPage);
}
function saveRestFromModal(){saveRest(S.logDate); hideModal();}
function deleteLog(){
  if(!confirm('Remove this log entry?'))return;
  delete S.logs[S.logDate];
  saveLogsToFirebase();
  hideModal();
  render(S.curPage);
}

function showModal(){document.getElementById('modal-overlay').classList.remove('hidden')}
function hideModal(){document.getElementById('modal-overlay').classList.add('hidden')}
document.getElementById('modal-overlay').addEventListener('click',function(e){if(e.target===this)hideModal()});

// Stats
function renderStats(){
  const tr=totalReps(),wd=wDays(),rd=rDays(),st=streak(),bd=bestDay(),ag=avgDay();
  const g=S.user?.goalDays||30,t=S.user?.target||100;
  const hitRate=wd.length?Math.round(wd.filter(([,v])=>v.total>=t).length/wd.length*100):0;
  const p=pct();

  const l7=Array.from({length:7},(_,i)=>{
    const d=new Date();d.setDate(d.getDate()-(6-i));
    const k=fmt(d),e=S.logs[k];
    return{label:DAYS_SHORT[d.getDay()],val:e?.type==='workout'?e.total:0,type:e?.type||'none'};
  });
  const mx=Math.max(...l7.map(x=>x.val),1);
  const bars=l7.map(d=>{
    const h=d.type==='rest'?22:Math.max(5,(d.val/mx)*80);
    const cls=d.type==='workout'?'bar-w':d.type==='rest'?'bar-r':'bar-e';
    return`<div class="bw"><div style="font-size:9px;color:var(--txt2);margin-bottom:2px">${d.val||''}</div><div class="bar ${cls}" style="height:${h}px"></div><div class="bl">${d.label}</div></div>`;
  }).join('');

  document.getElementById('page-stats').innerHTML=`
    <div class="sh">STATISTICS</div>
    <div class="ss">Full performance breakdown</div>
    <div class="hero"><div class="hero-n">${tr.toLocaleString()}</div><div class="hero-l">Total Pull-Ups</div></div>
    <div class="sg">
      <div class="sgc"><div class="sgc-v">${wd.length}</div><div class="sgc-l">Workouts</div></div>
      <div class="sgc"><div class="sgc-v">${rd.length}</div><div class="sgc-l">Rest Days</div></div>
      <div class="sgc"><div class="sgc-v">${st}</div><div class="sgc-l">🔥 Streak</div></div>
      <div class="sgc"><div class="sgc-v">${bd}</div><div class="sgc-l">Best Day</div></div>
      <div class="sgc"><div class="sgc-v">${ag}</div><div class="sgc-l">Daily Avg</div></div>
      <div class="sgc"><div class="sgc-v">${hitRate}%</div><div class="sgc-l">Target Hit</div></div>
    </div>
    <div class="chart-box"><div class="chart-l">Last 7 Days</div><div class="bars">${bars}</div></div>
    <div class="card">
      <div class="card-title">Challenge Progress</div>
      <div style="display:flex;justify-content:space-between;margin-bottom:6px"><span style="font-size:14px;color:var(--txt2)">Days Completed</span><span style="font-weight:600">${wd.length} / ${g}</span></div>
      <div class="prog-wrap"><div class="prog-fill" style="width:${p}%"></div></div>
      <div style="margin-top:10px;font-size:12px;color:var(--txt2)">${p}% of ${g}-day challenge complete · ${dLeft()} days remaining</div>
    </div>
  `;
}

// Profile
function renderProf(){
  const u=S.user;
  const av=u.avatarImg?`<img src="${u.avatarImg}">`:u.avatar;

  document.getElementById('page-prof').innerHTML=`
    <div class="sh">PROFILE</div>
    <div class="prof-top">
      <div class="p-av" onclick="document.getElementById('avatar-upload').click()">${av}<div class="p-av-ovr">CHANGE</div></div>
      <div class="p-name">${escapeHtml(u.name.toUpperCase())}</div>
      <div class="p-age">Age ${u.age} · ${u.goalDays}-day challenge</div>
    </div>
    <div class="p-quote">"${escapeHtml(u.quote)}"</div>
    <div class="card">
      <div class="card-title">Edit Profile</div>
      <div class="fg"><label class="fl">Name</label><input class="fi" id="e-name" value="${escapeHtml(u.name)}" maxlength="20"></div>
      <div class="fg"><label class="fl">Age</label><input class="fi" id="e-age" type="number" value="${u.age}" min="10" max="99"></div>
      <div class="fg"><label class="fl">Goal Days</label><input class="fi" id="e-days" type="number" value="${u.goalDays}" min="7" max="365"></div>
      <div class="fg"><label class="fl">Daily Target</label><input class="fi" id="e-target" type="number" value="${u.target||100}" min="10"></div>
      <div class="fg"><label class="fl">Quote</label><input class="fi" id="e-quote" value="${escapeHtml(u.quote)}" maxlength="90"></div>
      <div class="fg"><label class="fl">Avatar Emoji</label><div class="av-grid" id="edit-av-grid"></div></div>
      <button class="btn btn-gold" id="save-btn" onclick="saveProf()">Save Changes</button>
    </div>
    <div class="divider"></div>
    <button class="btn btn-red" onclick="signOut()">🚪 Sign Out</button>
    <div style="height:10px"></div>
  `;
  initAvGrid('edit-av-grid', u.avatar, 'selEditAv');
  S.editAv=null;
}

function escapeHtml(str){
  return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'})[m]);
}

function saveProf(){
  const name=document.getElementById('e-name').value.trim();
  if(!name){alert('Name cannot be empty.');return}
  S.user={...S.user, name,
    age:parseInt(document.getElementById('e-age').value)||S.user.age,
    goalDays:parseInt(document.getElementById('e-days').value)||S.user.goalDays,
    target:parseInt(document.getElementById('e-target').value)||S.user.target,
    quote:document.getElementById('e-quote').value.trim()||S.user.quote,
    avatar:S.editAv||S.user.avatar,
  };
  saveUserToFirebase();
  const btn=document.getElementById('save-btn');
  if(btn){btn.textContent='✓ Saved!';btn.style.background='var(--grn)';btn.style.color='#000';
    setTimeout(()=>{btn.textContent='Save Changes';btn.style.background='';btn.style.color=''},2000)}
  renderProf();
}

function handleAvatarUpload(input){
  const file=input.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=e=>{S.user.avatarImg=e.target.result;saveUserToFirebase();renderProf()};
  r.readAsDataURL(file);
}

// Friends
function renderFriends(){
  const friends = S.friends || {};
  const friendList = Object.entries(friends);

  document.getElementById('page-friends').innerHTML=`
    <div class="sh">FRIENDS</div>
    <div class="ss">Your pull-up crew</div>
    <div class="fg">
      <label class="fl">Add Friend by UID</label>
      <input class="fi" id="friend-uid-input" placeholder="Friend's User ID">
    </div>
    <button class="btn btn-gold" onclick="addFriend()">+ Add Friend</button>
    <div style="margin-top:14px">
      ${friendList.length===0 ? '<div style="color:var(--txt2);text-align:center;padding:20px">No friends yet. Add someone!</div>' : ''}
      ${friendList.map(([uid]) => {
        const friend = friends[uid] || {};
        return `<div class="friend-card" onclick="viewFriend('${uid}')">
          <div class="friend-av">${friend.avatar||'👤'}</div>
          <div class="friend-info">
            <div class="friend-name">${escapeHtml(friend.name||'Unknown')}</div>
            <div class="friend-detail">Tap to view stats</div>
          </div>
          <button class="friend-remove" onclick="event.stopPropagation(); removeFriend('${uid}')">✕</button>
        </div>`;
      }).join('')}
    </div>
  `;
}

function addFriend(){
  const uid = document.getElementById('friend-uid-input').value.trim();
  if(!uid) return alert('Enter a UID');
  if(uid === S.uid) return alert('Cannot add yourself');
  db.ref('users/' + uid).once('value').then(snap => {
    const val = snap.val();
    if(!val) return alert('User not found');
    if(!S.friends) S.friends = {};
    S.friends[uid] = { name: val.name, avatar: val.avatar, avatarImg: val.avatarImg || null };
    friendsRef().set(S.friends);
    render('friends');
  }).catch(e => alert('Error: '+e.message));
}

function removeFriend(uid){
  if(!confirm('Remove this friend?')) return;
  delete S.friends[uid];
  friendsRef().set(S.friends);
  render('friends');
}

function viewFriend(uid){
  db.ref('users/' + uid).once('value').then(snap => {
    const f = snap.val();
    if(!f) return alert('User no longer exists');
    showFriendView(uid, f);
  });
}

function showFriendView(uid, f){
  const logs = f.logs || {};
  const w = Object.entries(logs).filter(([,v])=>v.type==='workout');
  const r = Object.entries(logs).filter(([,v])=>v.type==='rest');
  const total = w.reduce((s,[,v])=>s+(v.total||0),0);
  const best = w.length ? Math.max(...w.map(([,v])=>v.total||0)) : 0;
  const avg = w.length ? Math.round(total/w.length) : 0;
  const streak = (()=>{
    let n=0,d=new Date();
    while(true){
      const k=fmt(d),e=logs[k];
      if(!e||e.type!=='workout'){if(k===todayStr()&&!e){d.setDate(d.getDate()-1);continue}break}
      n++;d.setDate(d.getDate()-1);
    }
    return n;
  })();
  const p = f.goalDays ? Math.min(100, Math.round(w.length/f.goalDays*100)) : 0;

  const av = f.avatarImg ? `<img src="${f.avatarImg}" style="width:60px;height:60px;border-radius:50%;object-fit:cover">` : f.avatar;

  document.getElementById('friend-view').innerHTML = `
    <div class="friend-view-header">
      <button class="btn btn-dark" style="width:auto;padding:8px 16px;font-size:14px" onclick="closeFriendView()">← Back</button>
      <div style="flex:1;text-align:right">
        <button class="btn btn-dark" style="width:auto;padding:8px 16px;font-size:14px" onclick="removeFriend('${uid}');closeFriendView()">Remove Friend</button>
      </div>
    </div>
    <div class="prof-top" style="padding-top:0">
      <div style="font-size:60px">${av}</div>
      <div class="p-name">${escapeHtml(f.name.toUpperCase())}</div>
      <div class="p-age">Age ${f.age} · ${f.goalDays}-day challenge</div>
    </div>
    <div class="hero"><div class="hero-n">${total.toLocaleString()}</div><div class="hero-l">Total Pull-Ups</div></div>
    <div class="sg">
      <div class="sgc"><div class="sgc-v">${w.length}</div><div class="sgc-l">Workouts</div></div>
      <div class="sgc"><div class="sgc-v">${r.length}</div><div class="sgc-l">Rest Days</div></div>
      <div class="sgc"><div class="sgc-v">${streak}</div><div class="sgc-l">🔥 Streak</div></div>
      <div class="sgc"><div class="sgc-v">${best}</div><div class="sgc-l">Best Day</div></div>
      <div class="sgc"><div class="sgc-v">${avg}</div><div class="sgc-l">Daily Avg</div></div>
      <div class="sgc"><div class="sgc-v">${p}%</div><div class="sgc-l">Complete</div></div>
    </div>
    ${f.quote ? `<div class="p-quote">"${escapeHtml(f.quote)}"</div>` : ''}
  `;
  document.getElementById('friend-view').classList.remove('hidden');
}

function closeFriendView(){
  document.getElementById('friend-view').classList.add('hidden');
}

// Init
initAvGrid('av-grid', S.selAv, 'selAv');
</script>
</body>
</html>
