<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>IronPull</title>
<link id="apple-icon" rel="apple-touch-icon">
<link id="favicon" rel="icon" type="image/png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IronPull">
<meta name="theme-color" content="#07070f">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<link rel="stylesheet" href="styles.css">

<style>
/* ══════════ AUTH REDESIGN ══════════ */
.auth{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  overflow-y:auto;background:#07070f;z-index:9999;
}
.auth::before{
  content:'';position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 60% 40% at 15% 10%,rgba(212,175,55,.13) 0%,transparent 55%),
             radial-gradient(ellipse 50% 50% at 85% 85%,rgba(59,130,246,.07) 0%,transparent 55%);
}
.auth-inner{
  position:relative;z-index:1;width:100%;max-width:390px;
  padding:24px 22px 44px;display:flex;flex-direction:column;align-items:center;
}

/* lang toggle */
.auth-lang{
  align-self:flex-end;display:flex;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
  border-radius:20px;overflow:hidden;margin-bottom:24px;
}
.auth-lang-btn{
  padding:5px 13px;font-size:11px;font-weight:600;letter-spacing:.05em;
  color:rgba(255,255,255,.35);background:none;border:none;cursor:pointer;
  transition:all .2s;font-family:'DM Sans',sans-serif;
}
.auth-lang-btn.active{background:rgba(212,175,55,.2);color:#d4af37;}

/* logo */
.auth-logo-wrap{position:relative;display:inline-block;text-align:center;margin-bottom:28px;}
.auth-glow{
  position:absolute;inset:-22px;
  background:radial-gradient(ellipse,rgba(212,175,55,.3) 0%,transparent 68%);
  border-radius:50%;animation:aGlow 3s ease-in-out infinite;
}
@keyframes aGlow{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.1)}}
.auth-logo-txt{
  font-family:'Bebas Neue',sans-serif;font-size:52px;letter-spacing:4px;
  background:linear-gradient(135deg,#f5d06b 0%,#d4af37 40%,#a0832a 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  line-height:1;position:relative;z-index:1;display:block;
}
.auth-logo-sub{
  font-family:'DM Sans',sans-serif;font-size:11px;font-weight:500;
  letter-spacing:3px;color:rgba(255,255,255,.28);text-transform:uppercase;margin-top:5px;
}

/* tabs */
.auth-tabs{
  display:flex;width:100%;background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.08);border-radius:13px;padding:4px;margin-bottom:22px;
}
.auth-tab{
  flex:1;padding:10px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;
  color:rgba(255,255,255,.35);background:none;border:none;border-radius:9px;
  cursor:pointer;transition:all .25s;
}
.auth-tab.active{background:rgba(212,175,55,.16);color:#d4af37;box-shadow:0 0 18px rgba(212,175,55,.1);}

/* panels */
.auth-panel{display:none;flex-direction:column;gap:11px;width:100%;}
.auth-panel.active{display:flex;}

/* google button */
.btn-goog{
  display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
  padding:13px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
  border-radius:12px;color:#fff;font-family:'DM Sans',sans-serif;font-size:15px;
  font-weight:500;cursor:pointer;transition:all .2s;box-sizing:border-box;
}
.btn-goog:hover{background:rgba(255,255,255,.1);}
.btn-goog svg{width:20px;height:20px;flex-shrink:0;}

/* divider */
.auth-or{
  display:flex;align-items:center;gap:12px;
  color:rgba(255,255,255,.2);font-size:12px;font-family:'DM Sans',sans-serif;
}
.auth-or::before,.auth-or::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.1);}

/* input field */
.auth-field{position:relative;width:100%;}
.auth-ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.25);pointer-events:none;}
.auth-inp{
  width:100%;padding:13px 13px 13px 41px;background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.1);border-radius:12px;color:#fff;
  font-family:'DM Sans',sans-serif;font-size:15px;outline:none;
  transition:all .2s;box-sizing:border-box;
}
.auth-inp::placeholder{color:rgba(255,255,255,.25);}
.auth-inp:focus{border-color:rgba(212,175,55,.5);background:rgba(212,175,55,.04);box-shadow:0 0 0 3px rgba(212,175,55,.07);}

/* primary button */
.btn-auth{
  width:100%;padding:14px;background:linear-gradient(135deg,#d4af37,#a0832a);
  border:none;border-radius:12px;color:#07070f;font-family:'DM Sans',sans-serif;
  font-size:15px;font-weight:700;letter-spacing:.4px;cursor:pointer;
  transition:all .2s;box-shadow:0 4px 20px rgba(212,175,55,.28);
}
.btn-auth:hover{transform:translateY(-1px);box-shadow:0 6px 28px rgba(212,175,55,.38);}

/* forgot / terms */
.auth-forgot{text-align:center;font-size:13px;color:rgba(255,255,255,.3);cursor:pointer;font-family:'DM Sans',sans-serif;transition:color .2s;}
.auth-forgot:hover{color:#d4af37;}
.auth-terms{text-align:center;font-size:11px;color:rgba(255,255,255,.18);font-family:'DM Sans',sans-serif;line-height:1.5;}
</style>
</head>
<body>
<div id="app">

<!-- ══════════ AUTH SCREEN ══════════ -->
<div class="auth" id="auth-screen">
  <div class="auth-inner">

    <!-- Language toggle -->
    <div class="auth-lang">
      <button class="auth-lang-btn active" id="alb-en" onclick="IPLang.set('en')">EN</button>
      <button class="auth-lang-btn"        id="alb-ka" onclick="IPLang.set('ka')">ქარ</button>
    </div>

    <!-- Logo -->
    <div class="auth-logo-wrap">
      <div class="auth-glow"></div>
      <span class="auth-logo-txt">IRONPULL</span>
      <div class="auth-logo-sub" data-i18n="tagline">Elite Pull-Up Tracker</div>
    </div>

    <!-- Tabs -->
    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-si" onclick="authTab('si')" data-i18n="signin">Sign In</button>
      <button class="auth-tab"        id="tab-su" onclick="authTab('su')" data-i18n="signup">Sign Up</button>
    </div>

    <!-- Sign In Panel -->
    <div class="auth-panel active" id="panel-si">
      <button class="btn-goog" onclick="authGoogleSignIn()">
        <svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        <span data-i18n="google">Continue with Google</span>
      </button>
      <div class="auth-or"><span data-i18n="or">or</span></div>
      <div class="auth-field">
        <span class="auth-ico"><svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg></span>
        <input class="auth-inp" id="auth-email" type="email" placeholder="Email" autocomplete="email">
      </div>
      <div class="auth-field">
        <span class="auth-ico"><svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg></span>
        <input class="auth-inp" id="auth-pass" type="password" data-i18n-ph="password" placeholder="Password" autocomplete="current-password">
      </div>
      <button class="btn-auth" onclick="authSignIn()"><span data-i18n="signin">Sign In</span></button>
      <div class="auth-forgot" onclick="resetPassword()" data-i18n="forgot">Forgot password?</div>
    </div>

    <!-- Sign Up Panel -->
    <div class="auth-panel" id="panel-su">
      <button class="btn-goog" onclick="authGoogleSignIn()">
        <svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        <span data-i18n="google">Continue with Google</span>
      </button>
      <div class="auth-or"><span data-i18n="or">or</span></div>
      <div class="auth-field">
        <span class="auth-ico"><svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg></span>
        <input class="auth-inp" id="reg-email" type="email" placeholder="Email" autocomplete="email">
      </div>
      <div class="auth-field">
        <span class="auth-ico"><svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg></span>
        <input class="auth-inp" id="reg-pass" type="password" data-i18n-ph="password" placeholder="Password" autocomplete="new-password">
      </div>
      <div class="auth-field">
        <span class="auth-ico"><svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg></span>
        <input class="auth-inp" id="reg-pass2" type="password" data-i18n-ph="confirm" placeholder="Confirm Password" autocomplete="new-password">
      </div>
      <button class="btn-auth" onclick="doRegister()"><span data-i18n="create">Create Account</span></button>
      <div class="auth-terms" data-i18n="terms">By signing up you agree to our Terms of Service</div>
    </div>

  </div>
</div>

<!-- ONBOARDING -->
<div class="ob hidden" id="ob">
  <div class="ob-logo">IRONPULL</div>
  <div class="ob-tag">Elite Pull-Up Tracker</div>
  <div class="ob-dots" id="ob-dots">
    <div class="ob-dot active"></div><div class="ob-dot"></div><div class="ob-dot"></div>
  </div>
  <div class="ob-step active" id="ob-s1">
    <div class="ob-h">WHO ARE YOU?</div>
    <div class="ob-sub">Set up your profile.</div>
    <div class="fg"><label class="fl">Your Name</label><input class="fi" id="ob-name" type="text" placeholder="e.g. Alex" maxlength="20"></div>
    <div class="fg"><label class="fl">Age</label><input class="fi" id="ob-age" type="number" placeholder="e.g. 25" min="10" max="99"></div>
    <div class="spacer"></div>
    <button class="btn btn-gold" onclick="obNext(1)">Continue →</button>
  </div>
  <div class="ob-step" id="ob-s2">
    <div class="ob-h">YOUR CHALLENGE</div>
    <div class="ob-sub">Set your challenge and daily target.</div>
    <div class="fg"><label class="fl">Duration (days)</label><input class="fi" id="ob-days" type="number" value="30" min="7" max="365"></div>
    <div class="fg"><label class="fl">Daily Target</label><input class="fi" id="ob-target" type="number" value="100" min="10" max="1000"></div>
    <div class="fg"><label class="fl">Note / Bio</label><input class="fi" id="ob-quote" type="text" placeholder="Pain is temporary..." maxlength="200"></div>
    <div class="spacer"></div>
    <button class="btn btn-gold" onclick="obNext(2)">Continue →</button>
    <button class="btn btn-dark" onclick="obBack(1)">← Back</button>
  </div>
  <div class="ob-step" id="ob-s3">
    <div class="ob-h">PICK YOUR AVATAR</div>
    <div class="ob-sub">Choose an emoji avatar.</div>
    <div class="av-grid" id="av-grid"></div>
    <div class="spacer"></div>
    <button class="btn btn-gold" onclick="obFinish()">🚀 Start Challenge</button>
    <button class="btn btn-dark" onclick="obBack(2)">← Back</button>
  </div>
</div>

<!-- PAGES -->
<div class="page active" id="page-home"></div>
<div class="page" id="page-cal"></div>
<div class="page" id="page-stats"></div>
<div class="page" id="page-prof"></div>
<div class="page" id="page-friends"></div>
<div class="page" id="page-shop"></div>

<!-- NAV -->
<div class="nav">
  <button class="nb active" id="nb-home" onclick="go('home')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    <span data-i18n="nav_home">Home</span>
  </button>
  <button class="nb" id="nb-stats" onclick="go('stats')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
    <span data-i18n="nav_stats">Stats</span>
  </button>
  <div class="nav-fab-wrap">
    <div class="nav-fab" id="nb-cal" onclick="go('cal')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span data-i18n="nav_log">LOG</span>
    </div>
  </div>
  <button class="nb" id="nb-friends" onclick="go('friends')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
    <span data-i18n="nav_friends">Friends</span>
  </button>
  <button class="nb" id="nb-prof" onclick="go('prof')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    <span data-i18n="nav_prof">Profile</span>
  </button>
</div>

<!-- LOG MODAL -->
<div class="overlay hidden" id="modal-overlay">
  <div class="modal">
    <div class="mhandle"></div>
    <div id="modal-body"></div>
  </div>
</div>

<!-- FRIEND VIEW -->
<div class="friend-view hidden" id="friend-view"></div>

<!-- INVENTORY MODAL — Frames tab added -->
<div class="inventory-modal hidden" id="inventory-modal">
  <div class="inv-modal-content">
    <div class="inv-modal-header">
      <h2>🎒 <span data-i18n="inventory">Inventory</span></h2>
      <button class="inv-close-btn" onclick="closeInventory()">✕</button>
    </div>
    <div class="inv-tabs">
      <button class="inv-tab active" data-tab="themes" data-i18n="themes">Themes</button>
      <button class="inv-tab" data-tab="titles" data-i18n="titles">Titles</button>
      <button class="inv-tab" data-tab="frames" data-i18n="inv_frames">Frames</button>
    </div>
    <div class="inv-items-container" id="inv-items-container"></div>
  </div>
</div>

<!-- TOAST -->
<div id="toast-container"></div>
<input type="file" id="avatar-upload" accept="image/*" style="display:none" onchange="handleAvatarUpload(this)">
</div>

<script src="script.js"></script>
<script src="script_patch.js"></script>
</body>
</html>
